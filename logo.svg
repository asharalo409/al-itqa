<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#380d1e" />
      <stop offset="60%" stop-color="#1c0710" />
      <stop offset="100%" stop-color="#0f0308" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5" />
      <stop offset="35%" stop-color="#f6d58a" />
      <stop offset="70%" stop-color="#e9b44c" />
      <stop offset="100%" stop-color="#bd8724" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle Islamic Geometric watermark circle -->
  <circle cx="250" cy="240" r="190" fill="none" stroke="#e9b44c" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6,4" />
  <circle cx="250" cy="240" r="160" fill="none" stroke="#e9b44c" stroke-width="1" stroke-opacity="0.1" />

  <!-- Stylized Al-Itqan Calligraphic Emblem -->
  <g transform="translate(250, 235) scale(0.95)" filter="url(#goldGlow)">
    <!-- Central diamond-leaf calligraphic composition -->
    <path d="M 0,-150 C 30,-120 70,-60 85,10 C 95,50 85,90 50,130 C 20,155 -20,155 -50,130 C -85,90 -95,50 -85,10 C -70,-60 -30,-120 0,-150 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />

    <!-- Swooping Arabic calligraphy strokes representing 'الإتقان' -->
    <!-- Main swoosh right -->
    <path d="M -5,-140 C 25,-100 65,-40 68,25 C 70,70 45,105 10,125 C -5,133 -20,125 -10,105 C 15,85 45,55 42,10 C 40,-35 5,-85 -5,-140 Z" fill="url(#goldGrad)" />
    <!-- Secondary inner wave -->
    <path d="M -15,-105 C 10,-70 42,-20 44,30 C 45,65 25,92 0,105 C -12,110 -22,102 -15,88 C 5,72 25,48 24,15 C 22,-20 -5,-60 -15,-105 Z" fill="url(#goldGrad)" />
    <!-- Center letter forms and dots -->
    <path d="M -30,-40 C -10,-20 18,15 15,50 C 12,75 -5,95 -25,95 C -45,95 -60,75 -55,50 C -50,20 -35,-15 -30,-40 Z" fill="url(#goldGrad)" />
    <!-- Diacritical marks / nuktas / harakat -->
    <polygon points="-25,10 -15,5 -20,-5 -30,0" fill="url(#goldGrad)" />
    <polygon points="-12,22 -2,17 -7,7 -17,12" fill="url(#goldGrad)" />
    <polygon points="-38,22 -28,17 -33,7 -43,12" fill="url(#goldGrad)" />
    <!-- Lower anchor swoosh representing 40 / Quran base -->
    <path d="M -75,20 C -55,55 -30,105 5,120 C 35,135 70,120 85,95 C 92,85 80,75 70,85 C 55,102 30,110 5,98 C -22,85 -45,45 -62,15 C -68,5 -78,10 -75,20 Z" fill="url(#goldGrad)" />
    <!-- Quran / Academic accent arch -->
    <path d="M -70,-10 C -45,-30 -15,-38 15,-38 C 45,-38 75,-30 100,-10" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Typography: AL-ITQAN - 40 -->
  <text x="250" y="420" font-family="'Plus Jakarta Sans', 'Hind Siliguri', sans-serif" font-size="24" font-weight="800" letter-spacing="5" fill="url(#goldGrad)" text-anchor="middle">
    AL-ITQAN—40
  </text>
  <text x="250" y="445" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="#c9a99b" text-anchor="middle">
    আল কুরআন ও ইসলামিক স্টাডিজ · ইবি
  </text>
</svg>
